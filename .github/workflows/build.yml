name: Prepare Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Zip Package
      run: |
        mkdir -p dist/WhatsApp_CRM_Installer
        cp app.py dist/WhatsApp_CRM_Installer/
        
        # Create a universal one-click setup script for Windows users
        echo '@echo off' > dist/WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'echo Setting up your WhatsApp Marketing Software dependencies...' >> dist/WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'pip install pyinstaller pandas openpyxl Pillow pywhatkit requests' >> dist/WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'echo Compiling application for your Windows setup...' >> dist/WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'pyinstaller --onefile --noconsole --name="WhatsApp_CRM" app.py' >> dist/WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'echo Done! Launching your app...' >> dist/WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'start dist/WhatsApp_CRM.exe' >> dist/WhatsApp_CRM_Installer/install_and_run_windows.bat

        # Create a universal one-click setup script for Mac users
        echo '#!/bin/bash' > dist/WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'echo Setting up your WhatsApp Marketing Software dependencies...' >> dist/WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'pip3 install pyinstaller pandas openpyxl Pillow pywhatkit requests' >> dist/WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'echo Compiling application for your macOS setup...' >> dist/WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'pyinstaller --onefile --noconsole --name="WhatsApp_CRM" app.py' >> dist/WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'echo Done! Launching your app...' >> dist/WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'open dist/WhatsApp_CRM.app' >> dist/WhatsApp_CRM_Installer/install_and_run_mac.sh
        chmod +x dist/WhatsApp_CRM_Installer/install_and_run_mac.sh

        cd dist && zip -r WhatsApp_CRM_Source.zip WhatsApp_CRM_Installer/

    - name: Upload Universal Package
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp_CRM_Universal
        path: dist/WhatsApp_CRM_Source.zip
