name: Package Codebase

on:
  push:
    tags:
      - 'v*'

# THIS SECURES WRITING PERMISSIONS FOR YOUR RELEASE FILES
permissions:
  contents: write

jobs:
  zip-project:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Installer Package
      run: |
        mkdir -p WhatsApp_CRM_Installer
        cp app.py WhatsApp_CRM_Installer/
        
        # Windows Installer Script Setup
        echo '@echo off' > WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'echo Setting up your WhatsApp Marketing Software dependencies...' >> WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'pip install pyinstaller pandas openpyxl Pillow pywhatkit requests' >> WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'echo Compiling application for your Windows setup...' >> WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'pyinstaller --onefile --noconsole --name="WhatsApp_CRM" app.py' >> WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'echo Done! Launching your app...' >> WhatsApp_CRM_Installer/install_and_run_windows.bat
        echo 'start dist/WhatsApp_CRM.exe' >> WhatsApp_CRM_Installer/install_and_run_windows.bat

        # Mac Installer Script Setup
        echo '#!/bin/bash' > WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'echo Setting up your WhatsApp Marketing Software dependencies...' >> WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'pip3 install pyinstaller pandas openpyxl Pillow pywhatkit requests' >> WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'echo Compiling application for your macOS setup...' >> WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'pyinstaller --onefile --noconsole --name="WhatsApp_CRM" app.py' >> WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'echo Done! Launching your app...' >> WhatsApp_CRM_Installer/install_and_run_mac.sh
        echo 'open dist/WhatsApp_CRM.app' >> WhatsApp_CRM_Installer/install_and_run_mac.sh
        chmod +x WhatsApp_CRM_Installer/install_and_run_mac.sh

        zip -r WhatsApp_CRM_Source.zip WhatsApp_CRM_Installer/

    - name: Deploy to Release Page
      uses: softprops/action-gh-release@v2
      with:
        files: WhatsApp_CRM_Source.zip
