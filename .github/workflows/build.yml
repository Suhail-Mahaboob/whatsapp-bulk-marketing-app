name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Mac)
      if: matrix.os == 'macos-latest'
      run: |
        # PyAutoGUI needs these to compile on macOS servers
        brew install pyenv
        
    - name: Install All Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pandas openpyxl Pillow pywhatkit pyautogui requests

    - name: Build Application with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name="WhatsApp_CRM" app.py

    - name: Upload Finished Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp_CRM-Windows
        path: dist/WhatsApp_CRM.exe

    - name: Upload Finished Artifacts (Mac)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp_CRM-Mac
        path: dist/WhatsApp_CRM.app
